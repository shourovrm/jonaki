name = "jonaki-free"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One counter per phone and UTC day; entries expire on their own.
[[kv_namespaces]]
binding = "LIMITS"
id = "dd529570262547f4b34a2459d03aa486"

[vars]
DAILY_CALL_LIMIT = "20"
DAILY_TOTAL_CALL_LIMIT = "250"
MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"

# ACCOUNT_ID and CF_AI_TOKEN are secrets: set them with `wrangler secret put`, never here.
