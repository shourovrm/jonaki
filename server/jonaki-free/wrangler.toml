name = "jonaki-free"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One counter per phone and UTC day; entries expire on their own.
[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
DAILY_CALL_LIMIT = "60"
MODEL = "@cf/openai/gpt-oss-20b"

# ACCOUNT_ID and CF_AI_TOKEN are secrets: set them with `wrangler secret put`, never here.
